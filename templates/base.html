<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <meta name="Description" content="{{ description }}">
    <meta property="og:title" content="{{ og_title }}" />
    <meta property="og:description" content="{{ og_description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ og_url }}" />
    <meta property="og:image" content="{{ og_image }}"/>
    <meta property="og:site_name" content="{{ og_site_name }}" />
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:image" content="{{ twitter_image }}"/>
    <meta name="twitter:title" content="{{ twitter_title }}"/>
    <meta name="twitter:description" content="{{ twitter_description }}"/>
    <meta name="application-name" content="{{ application_name }}">
    <meta name="apple-mobile-web-app-title" content="{{ apple_mobile_web_app_title }}">
    <meta name="theme-color" content="{{ theme_color }}">
    <meta name="msapplication-TileColor" content="{{ msapplication_TileColor }}">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="alternate" href="{{ rss_url }}" type="application/rss+xml" title="{{ rss_title }}">
    <link rel="feed" href="{{ rss_url }}" type="application/rss+xml" title="{{ rss_title }}">
    <link rel="stylesheet" href="{{ static_url }}/css/style.min.css">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.1.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.1.1/css/all.min.css"></noscript>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css"></noscript>
    <meta name="msvalidate.01" content="166AB4EE5B2A22286AACF2A9E0CF14E8" />
    <meta name="baidu-site-verification" content="codeva-TuWhmJgIa4" />
</head>
<body data-header-desktop="fixed" data-header-mobile="auto">
    <script>
        (window.localStorage && localStorage.getItem('theme') ? localStorage.getItem('theme') === 'dark' : ('auto' === 'auto' ? window.matchMedia('(prefers-color-scheme: dark)').matches : 'auto' === 'dark')) && document.body.setAttribute('theme', 'dark');
    </script>

    <div id="mask"></div>
    <div class="wrapper">
        {% include 'header.html' %}
        <main class="main">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>
        {% include 'footer.html' %}
    </div>
</body>
</html>
