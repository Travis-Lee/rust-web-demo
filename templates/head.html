<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noodp" />

<title>{{ title }}</title>
<meta name="description" content="{{ description }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ og_title }}" />
<meta property="og:description" content="{{ og_description }}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ og_url }}" />
<meta property="og:image" content="{{ og_image }}" />
<meta property="og:site_name" content="{{ og_site_name }}" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="{{ twitter_image }}" />
<meta name="twitter:title" content="{{ twitter_title }}" />
<meta name="twitter:description" content="{{ twitter_description }}" />

<!-- PWA -->
<meta name="application-name" content="{{ application_name }}">
<meta name="apple-mobile-web-app-title" content="{{ apple_mobile_web_app_title }}">
<meta name="theme-color" content="{{ theme_color }}">
<meta name="msapplication-TileColor" content="{{ msapplication_TileColor }}">

<!-- Icons -->
<link rel="shortcut icon" href="{{ static_url }}/favicon.ico?v=2">
<link rel="icon" href="{{ static_url }}/favicon-32x32.png?v=2" sizes="32x32">
<link rel="apple-touch-icon" href="{{ static_url }}/apple-touch-icon.png?v=2">
<link rel="manifest" href="{{ static_url }}/site.webmanifest">

<!-- Feed -->
<link rel="canonical" href="{{ canonical_url }}">
<link rel="alternate" href="{{ rss_url }}" type="application/rss+xml" title="{{ rss_title }}">

<!-- 样式 -->
<link rel="stylesheet" href="{{ static_url }}/css/style.min.css">

<!-- FontAwesome + Animate -->
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.1.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.1.1/css/all.min.css"></noscript>

<link rel="preload" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css"></noscript>
