<footer>
    <div id="fixed-buttons">
        <a href="#" id="back-to-top" class="fixed-button" title="{{ back_to_top_title }}">
            <i class="fas fa-arrow-up fa-fw" aria-hidden="true"></i>
        </a>
        <a href="#" id="view-comments" class="fixed-button" title="{{ view_comments_title }}">
            <i class="fas fa-comment fa-fw" aria-hidden="true"></i>
        </a>
    </div>

    <!-- 非 Algolia 的功能保留 -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/lazysizes@5.3.2/lazysizes.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clipboard@2.0.11/dist/clipboard.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/sharer.js@0.5.1/sharer.min.js"></script>

    <!-- 代码配置（如果你模板用到了复制按钮等） -->
    <script type="text/javascript">
        window.config = {
            "code": {
                "copyTitle": "{{ copy_title }}",
                "maxShownLines": {{ max_shown_lines }}
            }
        };
    </script>

    <!-- 你的主题 JS -->
    <script type="text/javascript" src="/js/theme.min.js"></script>

    <!-- ✅ 自动隐藏加载遮罩 -->
    <script>
        window.addEventListener('load', function () {
            const mask = document.getElementById('mask');
            if (mask) {
                mask.style.display = 'none';
            }
        });
    </script>
</footer>
