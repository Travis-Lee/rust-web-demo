<!-- loading.min.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#000" stroke-width="2">
        <animate attributeName="stroke-dasharray" from="0, 62.8" to="62.8, 62.8" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-dashoffset" from="0" to="-62.8" dur="1s" repeatCount="indefinite"/>
    </circle>
</svg>
