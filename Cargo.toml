[package]
name = "rust-web-demo"
version = "0.1.0"
edition = "2021"

[lib]
name = "RustWeb"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
axum = "0.6"
axum-server = { version = "0.5", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tera = "1.17"         # 你也可以去 crates.io 查最新版本号
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }  # 如果需要自动派生序列化/反序列化特性
serde_json = "1.0"  # 指定版本号，1.0 是兼容的稳定版本
pulldown-cmark = "0.9"
tower-http = { version = "0.4.4", features = ["fs"] }
tantivy = "0.19"
anyhow = "1.0"



